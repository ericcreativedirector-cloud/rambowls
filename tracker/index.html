<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E1116">
<title>Rambowls · Stats</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;700&family=Roboto+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --lane:#0E1116; --lane-2:#161B22; --maple:#C8873C; --bone:#F3EEE3;
    --strike:#E85A52; --signal:#35A79B; --dim:#7A828E; --rule:#242B34;
    --display:"Anton", Impact, Haettenschweiler, sans-serif;
    --body:"Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    --data:"Roboto Mono", ui-monospace, Menlo, monospace;
  }
  *{box-sizing:border-box}
  html{
    scroll-snap-type:y proximity; scroll-behavior:smooth;
    scroll-padding-top:max(56px, calc(env(safe-area-inset-top) + 20px));
    -webkit-text-size-adjust:100%;
  }
  body{margin:0; background:var(--lane); color:var(--bone);
    font-family:var(--body); font-size:15px; line-height:1.5; -webkit-font-smoothing:antialiased;
    overscroll-behavior-y:none; -webkit-tap-highlight-color:transparent;}
  section{scroll-snap-align:start}
  @media (prefers-reduced-motion:reduce){ html{scroll-snap-type:none; scroll-behavior:auto} }
  .wrap{max-width:900px; margin:0 auto;
    padding-top:max(52px, calc(env(safe-area-inset-top) + 16px));
    padding-right:max(16px, env(safe-area-inset-right));
    padding-bottom:max(64px, calc(env(safe-area-inset-bottom) + 44px));
    padding-left:max(16px, env(safe-area-inset-left))}

  .ico{width:15px; height:15px; flex:0 0 auto; stroke:var(--maple); fill:none;
    stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round; vertical-align:-2px}
  .ico.ball{width:23px; height:23px; stroke-width:1.3}

  .topbar{font-family:var(--data); font-size:11px; letter-spacing:.2em;
    text-transform:uppercase; color:var(--maple); margin:0 0 18px;
    display:flex; align-items:center; gap:10px; line-height:1.7}

  /* Masthead metrics are copied from the Scheduler verbatim. The wordmark must
     never change size or spacing between the two pages — same clamp, same
     padding, same rhythm. Change one, change both. */
  .masthead{border-bottom:3px solid var(--maple); padding:10px 0 12px}
  /* Logo and nav share a row — mirrors the Scheduler exactly. */
  .brandrow{display:flex; align-items:flex-end; justify-content:space-between;
    gap:12px; flex-wrap:wrap}
  .brandrow h1{margin:0; flex:1 1 auto; min-width:0}
  .brandrow .nav{margin-top:0; flex:0 0 auto}
  h1{font-family:var(--display); font-weight:400; text-transform:uppercase;
    font-size:clamp(29px,9.2vw,54px); line-height:.88; letter-spacing:.01em; margin:0;
    word-break:break-word}
  h1 span{color:var(--maple)}

  /* shared Schedule · Stats nav — identical on both views */
  .nav{display:flex; gap:0; margin-top:16px; border:1px solid var(--rule);
    border-radius:2px; overflow:hidden; width:max-content; max-width:100%}
  .nav a{font-family:var(--data); font-size:11px; letter-spacing:.14em;
    text-transform:uppercase; text-decoration:none; color:var(--dim);
    padding:10px 16px; min-height:44px; display:flex; align-items:center;
    background:var(--lane-2)}
  .nav a + a{border-left:1px solid var(--rule)}
  .nav a:hover{color:var(--bone)}
  .nav a.on{color:#140C03; background:var(--maple); font-weight:700}

  .sub{font-family:var(--data); font-size:11px; letter-spacing:.1em; text-transform:uppercase;
    color:var(--dim); margin:12px 0 0}

  /* ---------- bowler selector ----------
     Brutalist on purpose: square corners, one thick maple rule down the left
     edge, a mono kicker doing the labelling and Anton carrying the name. It
     reads as structure rather than as a rounded UI widget, and it inverts to
     solid maple when open so the two states are unmistakable. */
  .picked{display:flex; align-items:center; gap:16px; width:100%; margin-top:18px;
    cursor:pointer; text-align:left; border-radius:2px;
    background:var(--lane-2); border:1px solid var(--rule);
    border-left:4px solid var(--maple);
    padding:10px 14px 11px 13px; color:var(--bone); min-height:44px;
    transition:background .15s ease, border-color .15s ease}
  .picked .stack{display:flex; flex-direction:column; gap:4px; min-width:0}
  .picked .kick{font-family:var(--data); font-size:8.5px; letter-spacing:.24em;
    text-transform:uppercase; color:var(--maple); line-height:1}
  .picked .nm{font-family:var(--display); font-weight:400; text-transform:uppercase;
    font-size:clamp(26px,7.6vw,38px); line-height:.92; letter-spacing:.02em}
  .picked .caret{margin-left:auto; flex:0 0 auto; width:14px; height:14px;
    stroke:var(--maple); fill:none; stroke-width:2.6; stroke-linecap:square;
    transition:transform .18s ease}
  .picked:hover{border-color:var(--maple)}
  /* open = inverted block. No ambiguity about which state you're in. */
  .picked[aria-expanded="true"]{background:var(--maple); border-color:var(--maple)}
  .picked[aria-expanded="true"] .kick,
  .picked[aria-expanded="true"] .nm{color:#140C03}
  .picked[aria-expanded="true"] .caret{stroke:#140C03; transform:rotate(180deg)}
  @media (prefers-reduced-motion:reduce){
    .picked, .picked .caret{transition:none}
  }
  @media (min-width:640px){ .picked{width:max-content; min-width:280px} }

  /* The open roster is a hard grid of squared blocks, not pills — it should
     look like the selector broke apart into its options. */
  .who{display:grid; grid-template-columns:repeat(auto-fill,minmax(104px,1fr));
    gap:1px; margin-top:1px; background:var(--rule);
    border:1px solid var(--rule); border-left:4px solid var(--maple)}
  .who button{cursor:pointer; border-radius:2px; border:0; background:var(--lane-2);
    color:var(--bone); font-family:var(--data); font-size:11px; letter-spacing:.12em;
    text-transform:uppercase; padding:13px 12px; min-height:48px; text-align:left}
  .who button:hover{color:var(--maple)}
  .who button.on{color:#140C03; background:var(--maple); font-weight:700}
  .whoask{font-family:var(--data); font-size:11px; letter-spacing:.12em; text-transform:uppercase;
    color:var(--maple); margin:14px 0 0}
  .sub{margin:14px 0 0}

  section{margin-top:44px}
  /* match the Scheduler's first-section rhythm under the masthead */
  #page > section:first-of-type{margin-top:24px}
  h2{font-family:var(--display); font-size:20px; letter-spacing:.06em;
    text-transform:uppercase; margin:0 0 4px; font-weight:400;
    display:flex; align-items:center; gap:9px}
  h2 .ico{width:17px; height:17px}
  .note{font-size:13.5px; color:var(--dim); margin:0 0 18px; max-width:62ch}
  .note b{color:var(--bone); font-weight:500}
  .tiny{font-family:var(--data); font-size:10.5px; letter-spacing:.06em; color:var(--dim);
    margin:12px 0 0}

  .stats{display:grid; grid-template-columns:repeat(auto-fit,minmax(132px,1fr)); gap:10px}
  .stat{background:var(--lane-2); border:1px solid var(--rule); border-radius:2px; padding:13px 14px}
  .stat b{display:block; font-family:var(--display); font-size:28px; font-weight:400;
    letter-spacing:.02em; color:var(--bone); line-height:1}
  .stat b small{font-size:14px; color:var(--dim)}
  .stat span{display:block; font-family:var(--data); font-size:9px; letter-spacing:.12em;
    text-transform:uppercase; color:var(--maple); margin-top:7px}
  .stat i{display:block; font-style:normal; font-family:var(--data); font-size:10px;
    color:var(--dim); margin-top:5px}

  .lane{position:relative; height:56px; border-radius:2px; overflow:hidden; margin-top:4px;
    background:repeating-linear-gradient(90deg,#3d2f1c 0 34px,#4a3922 34px 68px);
    border:1px solid #00000066}
  .lane .oil{position:absolute; inset:0; background:linear-gradient(90deg,#ffffff14,transparent 70%)}
  /* Progress is a hard maple fill with a solid leading edge — it shows the
     distance covered, not just a floating position, and it carries no emoji. */
  .lane .fill{position:absolute; left:0; top:0; bottom:0; width:0;
    background:linear-gradient(90deg,rgba(200,135,60,.16),rgba(200,135,60,.34));
    transition:width .6s ease}
  .lane .edge{position:absolute; top:0; bottom:0; width:5px; left:0;
    background:var(--maple); box-shadow:0 0 0 1px #00000055;
    transition:left .6s ease}
  @media (prefers-reduced-motion:reduce){
    .lane .fill, .lane .edge{transition:none}
  }
  .lane .mark{position:absolute; top:0; bottom:0; width:2px; background:#f3eee355}
  .lane .mark i{position:absolute; top:3px; left:5px; font-style:normal; font-size:9px; color:var(--bone);
    font-family:var(--data); letter-spacing:.08em; text-transform:uppercase; white-space:nowrap}
  .goalnote{display:flex; justify-content:space-between; gap:10px; flex-wrap:wrap;
    font-family:var(--data); font-size:11px; color:var(--dim); margin-top:9px}

  /* Shown instead of the lane when a bowler hasn't given us a target. We do
     not invent one — the app asks for it the same way availability replies
     work: prewritten text, no recipient, sender picks the thread. */
  .goalask{border:1px dashed var(--maple); border-radius:2px; padding:16px 17px;
    background:rgba(200,135,60,.05)}
  .goalask p{margin:0 0 13px; font-size:13.5px; color:var(--dim); max-width:48ch}
  .goalask a{display:inline-flex; align-items:center; justify-content:center;
    min-height:44px; padding:10px 17px; border-radius:2px; text-decoration:none;
    font-family:var(--data); font-size:11px; letter-spacing:.1em; text-transform:uppercase;
    background:var(--maple); color:#140C03; font-weight:700}
  .goalask a:active{transform:scale(.98)}

  /* Left gutter holds the scale labels; bars start after it. */
  .chart{display:flex; align-items:flex-end; gap:6px; height:158px; padding-top:10px;
    padding-left:30px; position:relative}
  .baseline{position:absolute; left:30px; right:0; border-top:2px dashed rgba(232,90,82,.6); pointer-events:none}
  .baseline i{position:absolute; right:2px; top:-15px; font-style:normal; font-family:var(--data);
    font-size:9px; color:var(--strike)}
  /* Faint horizontal rules so a bar's height can be read, not just compared. */
  .tickline{position:absolute; left:30px; right:0; border-top:1px solid rgba(122,130,142,.16);
    pointer-events:none}
  .tickline i{position:absolute; left:-30px; top:-6px; width:26px; text-align:right;
    font-style:normal; font-family:var(--data); font-size:8.5px; color:var(--dim)}
  .chart .col{flex:1; min-width:0; display:flex; flex-direction:column; align-items:center; gap:5px;
    height:100%; justify-content:flex-end; position:relative; z-index:1}
  .chart .bar{width:100%; max-width:40px; background:var(--maple); border-radius:2px 2px 0 0; flex-shrink:0}
  /* Teal when the night cleared the dashed baseline, muted when it didn't. */
  .chart .val{font-family:var(--data); font-size:10.5px; color:var(--dim)}
  .chart .val.over{color:var(--signal); font-weight:700}
  .chart .lab{font-family:var(--data); font-size:8.5px; letter-spacing:.04em; color:var(--dim)}
  .empty{font-family:var(--data); font-size:11px; color:var(--dim); letter-spacing:.06em}

  /* score log */
  .log{border-top:1px solid var(--rule)}
  .logrow{display:grid; grid-template-columns:1fr; gap:6px 14px;
    padding:13px 2px; border-bottom:1px solid var(--rule)}
  .logrow .wkn{font-family:var(--data); font-size:11px; letter-spacing:.1em; text-transform:uppercase;
    color:var(--maple); white-space:nowrap; display:flex; align-items:center; gap:9px; flex-wrap:wrap}
  .logrow .games{display:flex; flex-wrap:wrap; align-items:center; gap:9px}
  .logrow .sc{font-family:var(--data); font-size:16px; color:var(--bone)}
  .logrow .sc.none{color:var(--dim)}
  .logrow .dot{color:var(--rule)}
  .logrow .nightavg{font-family:var(--data); font-size:11px; color:var(--dim)}
  .logrow.prov{background:rgba(200,135,60,.06); border-radius:2px; padding-left:9px; padding-right:9px}
  .provlab{font-family:var(--data); font-size:9px; letter-spacing:.12em; text-transform:uppercase;
    color:var(--maple); border:1px solid var(--maple); border-radius:2px; padding:2px 6px}
  .entry{display:flex; align-items:center; gap:9px}
  .entry .g{font-family:var(--data); font-size:9px; letter-spacing:.12em; text-transform:uppercase;
    color:var(--maple); width:22px; flex:0 0 auto}
  input[type=number]{width:78px; background:var(--lane); border:1px solid var(--rule); border-radius:2px;
    color:var(--bone); padding:10px 8px; font-family:var(--data); font-size:15px; text-align:center;
    -moz-appearance:textfield; min-height:44px}
  input[type=number]:focus{outline:none; border-color:var(--maple)}
  input[type=number].bad{border-color:var(--strike)}

  footer{font-family:var(--data); font-size:9px; letter-spacing:.15em; text-transform:uppercase;
    color:var(--dim); opacity:.6; margin-top:44px; text-align:center; line-height:1.9}

  @media (min-width:640px){
    .wrap{padding-top:max(28px, calc(env(safe-area-inset-top) + 20px));
          padding-right:max(20px, env(safe-area-inset-right));
          padding-bottom:80px;
          padding-left:max(20px, env(safe-area-inset-left))}
    .masthead{padding-bottom:22px}
    .sub{font-size:12px; margin-top:14px}
    .stats{grid-template-columns:repeat(auto-fit,minmax(158px,1fr)); gap:12px}
    .stat b{font-size:32px}
    .chart{gap:8px; height:172px}
    .logrow{grid-template-columns:170px 1fr; align-items:baseline}
  }
</style>
</head>
<body>
<div class="wrap">

  <p class="topbar">
    <svg class="ico ball" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9.2"/><circle cx="9.4" cy="8.4" r="1.25" fill="#C8873C" stroke="none"/><circle cx="14" cy="7.7" r="1.25" fill="#C8873C" stroke="none"/><circle cx="12.6" cy="11.9" r="1.25" fill="#C8873C" stroke="none"/></svg>
    <span>2026 Fall Wednesday League<br>The Gutter Bar</span>
  </p>

  <div class="masthead">
    <div class="brandrow">
      <h1>Rambowls<br><span>Stats</span></h1>
      <nav class="nav">
        <a href="../">Schedule</a>
        <a class="on" href="./" aria-current="page">Stats</a>
      </nav>
    </div>

    <button class="picked" id="picked" type="button" style="display:none" aria-expanded="false">
      <span class="stack">
        <span class="kick">Bowler</span>
        <span class="nm" id="pickedName"></span>
      </span>
      <svg class="caret" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8.5 12 16.5 20 8.5"/></svg>
    </button>
    <p class="sub" id="pageSub"></p>
    <div class="who" id="whoRow"></div>
    <p class="whoask" id="whoAsk">Who's bowling?</p>
    <noscript><p class="sub">JavaScript required — stats won't load without it.</p></noscript>
  </div>

  <div id="page" style="display:none">

    <section>
      <h2><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19V11M9.3 19V5M14.7 19v-6M20 19V8"/></svg>The numbers</h2>
      <p class="note" id="numbersNote"></p>
      <div class="stats" id="statRow"></div>
      <p class="tiny" id="ballastNote"></p>
    </section>

    <section>
      <h2><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="3.4"/></svg><span id="laneTitle">Season goal</span></h2>
      <p class="note" id="goalNote"></p>
      <div id="goalBody">
        <div class="lane">
          <div class="oil"></div>
          <div class="fill" id="laneFill"></div>
          <div class="edge" id="laneEdge"></div>
          <div class="mark" style="left:0"><i id="laneLo"></i></div>
          <div class="mark" style="right:0"><i id="laneHi" style="left:auto; right:5px"></i></div>
        </div>
        <div class="goalnote"><span id="goalLeft"></span><span id="goalRight"></span></div>
      </div>
      <div class="goalask" id="goalAsk" style="display:none">
        <p id="goalAskCopy"></p>
        <a id="goalAskBtn" href="#">Send my goal</a>
      </div>
    </section>

    <section>
      <h2><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 16.5 9 11l3.5 3.5L20 6.5"/></svg>Night by night</h2>
      <p class="note">Dashed line · <b id="baseLabel">last season average</b></p>
      <div class="chart" id="chart"></div>
    </section>

    <section>
      <h2><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h14v16H5zM8.5 9h7M8.5 13h7M8.5 17h4"/></svg>Score log</h2>
      <p class="note" id="logNote"></p>
      <div class="log" id="log"></div>
    </section>

  </div>

  <footer>Rambowls · Fall 2026</footer>
</div>

<script src="../data.js"></script>
<script>
// If data.js failed to load there is nothing to render — say so plainly.
if (typeof RB === "undefined"){
  const s = document.getElementById("pageSub");
  if (s){ s.textContent = "Unable to load team data"; s.style.display = "block"; }
  const a = document.getElementById("whoAsk");
  if (a) a.style.display = "none";
  throw new Error("data.js did not load");
}

const WHOKEY = "rambowls_who";
const PROVKEY = id => "rambowls_prov_v1_" + id;
const esc = s => String(s).replace(/[&<>"]/g, c =>
  ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

let who = null;
try { who = localStorage.getItem(WHOKEY); } catch(e){}
// Names used to be stored as short labels ("Eric"); map either form to an id.
if (who && !RB.playerById(who)){
  const m = RB.PLAYERS.find(p => p.short === who || p.name === who);
  who = m ? m.id : null;
}
let pickerOpen = !who;

/* ---------- provisional scores (this device only) ----------
   Official score ALWAYS wins. Provisional exists only to fill a game the
   league sheet has not posted yet, and is deleted the moment it does. */
function loadProv(id){
  try {
    const raw = localStorage.getItem(PROVKEY(id));
    return raw ? JSON.parse(raw) : {};
  } catch(e){ return {}; }
}
function saveProv(id, prov){
  try { localStorage.setItem(PROVKEY(id), JSON.stringify(prov)); } catch(e){}
}

/* Drop any provisional value the league sheet has since published. */
function pruneProv(p){
  const prov = loadProv(p.id);
  let changed = false;
  for (const wk of Object.keys(prov)){
    const official = (p.scores || {})[wk] || [];
    for (const i of [0,1]){
      const o = official[i];
      if (o != null && o !== "" && prov[wk] && prov[wk][i] != null){
        delete prov[wk][i];
        changed = true;
      }
    }
    if (prov[wk] && Object.keys(prov[wk]).length === 0){ delete prov[wk]; changed = true; }
  }
  if (changed) saveProv(p.id, prov);
  return prov;
}

/* official ?? provisional — never the other way round. */
function displayScore(p, prov, wk, i){
  const official = ((p.scores || {})[wk] || [])[i];
  if (official != null && official !== "") return {v:+official, provisional:false};
  const local = (prov[wk] || {})[i];
  if (local != null && local !== "") return {v:+local, provisional:true};
  return {v:null, provisional:false};
}

/* Provisional entry is for TONIGHT only. On a bowling Wednesday you can fill in
   games the league sheet hasn't posted yet; by Thursday those revert to a
   read-only "—" until the official score lands. */
function openWeek(){
  const t = RB.todayISO();
  return RB.weeks().find(w => w.iso === t) || null;
}

function validScore(raw){
  if (raw === "") return {ok:true, value:null};
  if (!/^\d{1,3}$/.test(raw.trim())) return {ok:false};
  const n = +raw;
  if (!Number.isInteger(n) || n < 0 || n > 300) return {ok:false};
  return {ok:true, value:n};
}

/* ---------- player picker ---------- */
function renderWho(){
  const row = document.getElementById("whoRow");
  const picked = document.getElementById("picked");
  const ask = document.getElementById("whoAsk");
  const sub = document.getElementById("pageSub");

  row.innerHTML = "";
  for (const p of RB.PLAYERS){
    const b = document.createElement("button");
    b.type = "button";
    b.textContent = p.short;
    if (p.id === who) b.classList.add("on");
    b.addEventListener("click", () => {
      who = p.id;
      try { localStorage.setItem(WHOKEY, who); } catch(e){}
      pickerOpen = false;
      renderWho(); render();
    });
    row.appendChild(b);
  }

  // .who is a CSS grid now, so the open state must be "grid", not "flex"
  row.style.display = pickerOpen ? "grid" : "none";
  ask.style.display = (pickerOpen && !who) ? "block" : "none";
  picked.style.display = who ? "flex" : "none";
  picked.setAttribute("aria-expanded", String(pickerOpen));
  if (who) document.getElementById("pickedName").textContent = RB.playerById(who).short;

  const wk = RB.lastCompletedWeek();
  sub.textContent = who ? (wk ? `Through Week ${wk}` : "Season hasn't started") : "";
  sub.style.display = who ? "block" : "none";

  document.getElementById("page").style.display = who ? "block" : "none";
}

document.getElementById("picked").addEventListener("click", () => {
  pickerOpen = !pickerOpen;
  renderWho();
});

/* ---------- main render ---------- */
function render(){
  if (!who) return;
  const p = RB.playerById(who);
  const prov = pruneProv(p);
  const S = RB.playerStats(p.id);

  /* ----- the numbers (official data only, so they match the Scheduler) ----- */
  document.getElementById("numbersNote").innerHTML =
    (p.note ? esc(p.note) + " " : "") +
    (S.count ? `<b>${S.count}</b> game${S.count > 1 ? "s" : ""} in.` : "");

  document.getElementById("statRow").innerHTML = `
    <div class="stat">
      <b>${S.avgDisplay ?? "—"}</b><span>Average</span>
      ${S.ballast && S.count ? `<i>scratch ${Math.round(S.scratchAvg)}</i>` : ""}
    </div>
    <div class="stat"><b>+${S.hcp}</b><span>Handicap</span></div>
    <div class="stat"><b>${S.high ?? "—"}</b><span>High game</span></div>
    <div class="stat">
      <b>${S.count}<small>/${RB.SEASON.qualify}</small></b><span>To qualify</span>
      ${S.qualified ? `<i>Eligible</i>` : `<i>${S.toQualify} to go</i>`}
    </div>`;

  document.getElementById("ballastNote").textContent = S.ballast
    ? `League avg includes preseason ballast through Game ${RB.SEASON.ballast}.`
    : "";

  /* ----- road to goal -----
     Only rendered for bowlers who actually gave us a target. Everyone else
     gets asked for one rather than being handed a number they never chose. */
  const base = p.prev, goal = S.goal, a = S.leagueAvg;
  const body = document.getElementById("goalBody");
  const ask  = document.getElementById("goalAsk");

  if (!S.hasGoal){
    document.getElementById("laneTitle").textContent = "Season goal";
    document.getElementById("goalNote").innerHTML =
      `No target on file for ${esc(p.short)} yet.`;
    body.style.display = "none";
    ask.style.display  = "block";
    document.getElementById("goalAskCopy").textContent =
      `Pick a number and this page will track it all season. `
      + `Last season you averaged ${base}.`;
    // Same mechanism as the Scheduler's availability replies: prewritten
    // text, empty recipient, sender chooses the thread. No numbers in source.
    document.getElementById("goalAskBtn").href = "sms:?&body=" + encodeURIComponent(
      `Rambowls - ${p.short}'s season goal is ___ (last season ${base}). For the Stats page.`);
  } else {
    body.style.display = "block";
    ask.style.display  = "none";
    // Averages read as whole numbers here, the way the league sheet shows
    // them — so the headline card and this line can never disagree.
    const now = a == null ? null : Math.round(a);
    document.getElementById("laneTitle").textContent = "Road to " + goal;
    document.getElementById("goalNote").textContent = "";
    document.getElementById("laneLo").textContent = base + " last season";
    document.getElementById("laneHi").textContent = goal + " goal";
    const pct = a == null ? 0 : Math.min(1, Math.max(0, (a - base) / (goal - base)));
    document.getElementById("laneFill").style.width = (pct * 100) + "%";
    document.getElementById("laneEdge").style.left  = `calc(${pct * 100}% - 2.5px)`;
    document.getElementById("goalLeft").textContent = (a == null || !S.count)
      ? "No scores yet"
      : `Now ${now} — ${Math.round(pct * 100)}% of the way there`;
    document.getElementById("goalRight").textContent = (a == null || !S.count)
      ? ""
      // Measured off the SAME rounded figure shown as "Now", so 121 + 17 = 138
      // actually adds up for anyone who checks it.
      : (a >= goal ? "Goal cleared" : `${goal - now} pins to go`);
  }

  /* ----- night by night: completed nights only ----- */
  document.getElementById("baseLabel").textContent = `last season average (${base})`;
  const ch = document.getElementById("chart");
  const played = [];
  for (const w of RB.weeks()){
    const g = ((p.scores || {})[w.wk] || []).filter(v => v != null && v !== "").map(Number);
    if (g.length) played.push({date:w.date, v:g.reduce((x,y)=>x+y,0)/g.length});
  }
  if (!played.length){
    ch.innerHTML = `<span class="empty">No nights bowled yet.</span>`;
  } else {
    const maxV = Math.max((goal || 0) + 10, base + 10, ...played.map(n => n.v));
    const H = 112;
    /* Bars stay zero-based — an axis that starts at 90 would exaggerate every
       gap. The step is the smallest round number that keeps the chart under
       six gridlines, so the scale stays legible whether the range tops out
       at 130 or someone throws a 240 night. */
    const step = [10, 20, 25, 50, 100].find(s => maxV / s <= 6) || 100;
    const ticks = [];
    for (let v = step; v <= maxV; v += step) ticks.push(v);

    ch.innerHTML = played.map(n => `
      <div class="col">
        <div class="val${n.v > base ? " over" : ""}">${Math.round(n.v)}</div>
        <div class="bar" style="height:${Math.max(4, Math.round(n.v / maxV * H))}px"></div>
        <div class="lab">${n.date}</div>
      </div>`).join("");

    for (const v of ticks){
      const t = document.createElement("div");
      t.className = "tickline";
      t.style.bottom = (19 + v / maxV * H) + "px";
      t.innerHTML = `<i>${v}</i>`;
      ch.appendChild(t);
    }
    const bl = document.createElement("div");
    bl.className = "baseline";
    bl.style.bottom = (19 + base / maxV * H) + "px";
    bl.innerHTML = `<i>${base}</i>`;
    ch.appendChild(bl);
  }

  renderLog(p, prov);
}

/* ---------- score log ----------
   Past + current nights only. Official scores are read-only; the current
   night's missing games accept a provisional value. Future weeks show nothing
   to type into. */
function renderLog(p, prov){
  const log = document.getElementById("log");
  const open = openWeek();
  const openWk = open ? open.wk : 0;
  const t = RB.todayISO();
  const rows = [];

  for (const w of RB.weeks()){
    if (w.iso > t) continue;                 // future night — nothing to show
    const isOpen = w.wk === openWk;
    const cells = [0,1].map(i => {
      const d = displayScore(p, prov, w.wk, i);
      const opp = w.games[i] ? w.games[i].opp : "";
      if (d.v != null){
        return `<span class="sc" title="${esc(opp)}">${d.v}</span>`;
      }
      if (isOpen){
        return `<span class="entry"><span class="g">G${i+1}</span>
          <input type="number" inputmode="numeric" min="0" max="300" step="1" value=""
            data-w="${w.wk}" data-i="${i}" aria-label="Week ${w.wk} game ${i+1}"></span>`;
      }
      return `<span class="sc none" title="${esc(opp)}">—</span>`;
    });

    const nums = [0,1].map(i => displayScore(p, prov, w.wk, i).v).filter(v => v != null);
    const nightAvg = nums.length === 2
      ? `<span class="nightavg">night avg ${Math.round((nums[0]+nums[1])/2)}</span>` : "";
    const provRow = [0,1].some(i => displayScore(p, prov, w.wk, i).provisional);

    rows.push(`<div class="logrow${provRow ? " prov" : ""}">
      <div class="wkn">Wk ${w.wk} · ${w.date}${provRow ? ' <span class="provlab">Provisional</span>' : ""}</div>
      <div class="games">${cells[0]}<span class="dot">·</span>${cells[1]}${nightAvg}</div>
    </div>`);
  }

  log.innerHTML = rows.length ? rows.join("")
    : `<p class="empty" style="padding:14px 2px">No nights bowled yet.</p>`;

  document.getElementById("logNote").innerHTML = open
    ? `Official scores come from the league sheet. Week ${openWk} is still open — anything you type saves on this phone only, and the official score replaces it the moment the sheet posts.`
    : `Official scores come from the league sheet.`;

  log.querySelectorAll("input[type=number]").forEach(inp => {
    inp.addEventListener("change", e => {
      const el = e.target;
      const wk = el.dataset.w, i = +el.dataset.i;
      const check = validScore(el.value);
      if (!check.ok){ el.classList.add("bad"); return; }
      el.classList.remove("bad");
      const store = loadProv(p.id);
      if (check.value == null){
        // Clearing removes the key outright — never store a null that could
        // shadow an official score later.
        if (store[wk]){ delete store[wk][i]; if (!Object.keys(store[wk]).length) delete store[wk]; }
      } else {
        if (!store[wk]) store[wk] = {};
        store[wk][i] = check.value;
      }
      saveProv(p.id, store);
      render();
    });
  });
}

/* ---------- boot ---------- */
try {
  renderWho();
  render();
} catch (err){
  document.getElementById("pageSub").textContent = "Latest scores unavailable";
  document.getElementById("pageSub").style.display = "block";
  console.error("Rambowls stats failed:", err);
}
</script>
